<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0f766e">
  <title>Chromebook トラブル報告フォーム</title>

  <noscript>
    <meta http-equiv="refresh" content="0;url=https://script.google.com/a/macros/yahaba.ed.jp/s/AKfycbxHFOzLxT3ldbmP-utjZS2XweMZz-88Fb0clEQuwmEHRsFON9moYyiDAd0z4fxJJ-BJ/exec">
  </noscript>

  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #0f172a;
      background: #f8fafc;
    }

    main {
      max-width: 680px;
      margin: 48px auto;
      padding: 24px;
      background: #ffffff;
      border-top: 6px solid #0f766e;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.5rem;
    }

    p {
      line-height: 1.7;
    }

    a {
      color: #0f766e;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>Chromebook トラブル報告フォーム</h1>
    <p>報告フォームを開いています。</p>
    <p>
      自動的に移動しない場合は、
      <a id="manualLink" href="https://script.google.com/a/macros/yahaba.ed.jp/s/AKfycbxHFOzLxT3ldbmP-utjZS2XweMZz-88Fb0clEQuwmEHRsFON9moYyiDAd0z4fxJJ-BJ/exec">こちらを押してください</a>。
    </p>
  </main>

  <script>
    "use strict";

    const GAS_URL = "https://script.google.com/a/macros/yahaba.ed.jp/s/AKfycbxHFOzLxT3ldbmP-utjZS2XweMZz-88Fb0clEQuwmEHRsFON9moYyiDAd0z4fxJJ-BJ/exec";

    async function clearLegacyGitHubData() {
      if ("serviceWorker" in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(
          registrations.map((registration) => registration.unregister())
        );
      }

      if ("caches" in window) {
        const cacheNames = await caches.keys();
        await Promise.all(
          cacheNames.map((cacheName) => caches.delete(cacheName))
        );
      }
    }

    async function redirectToGas() {
      try {
        await Promise.race([
          clearLegacyGitHubData(),
          new Promise((resolve) => window.setTimeout(resolve, 1200))
        ]);
      } catch (error) {
        console.warn("GitHub Pagesの旧キャッシュ削除を継続できませんでした。", error);
      } finally {
        window.location.replace(GAS_URL);
      }
    }

    const manualLink = document.getElementById("manualLink");
    if (manualLink) {
      manualLink.href = GAS_URL;
    }

    redirectToGas();
  </script>
</body>
</html>
